<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1f5c3f" />
  <title>Scripts</title>
  <style>
    :root { --green: #1f5c3f; --cream: #fbf7ef; --ink: #1d2320; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--cream);
      color: var(--ink);
      font: 18px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }
    .skip {
      position: absolute;
      left: 12px;
      top: -40px;
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      z-index: 3;
    }
    .skip:focus { top: 8px; }
    main { max-width: 32rem; margin: 0 auto; padding: 20px 16px 108px; }
    h1 { margin: 0 0 6px; font-size: 1.7rem; line-height: 1.15; letter-spacing: -0.02em; }
    h1:focus,
    h1:focus-visible { outline: none; }
    .where { margin: 0 0 16px; color: var(--green); font-weight: 700; }
    label { display: block; font-weight: 700; margin: 0 0 8px; }
    input[type="search"] {
      width: 100%;
      min-height: 56px;
      margin: 0 0 16px;
      padding: 12px 16px;
      border: 2px solid var(--green);
      border-radius: 16px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .list { display: flex; flex-direction: column; gap: 12px; }
    button, .hit {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 12px 16px;
      border: 0;
      border-radius: 16px;
      background: var(--green);
      color: #fff;
      font: inherit;
      font-weight: 750;
      font-size: 1.15rem;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .hit { flex-direction: column; text-decoration: none; }
    .hit small { display: block; margin-top: 2px; font-size: 0.85rem; font-weight: 650; }
    .say {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .cue { margin: 0 0 6px; color: var(--green); font-weight: 700; }
    .block { margin: 0 0 22px; }
    .tip { margin: 8px 0 0; font-size: 1rem; font-weight: 500; }
    details { margin: 0 0 22px; }
    summary {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 12px 16px;
      border-radius: 16px;
      background: #fff;
      color: var(--green);
      font-weight: 750;
      border: 2px solid var(--green);
    }
    .empty { margin: 8px 0 0; }
    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 8px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: var(--cream);
      border-top: 1px solid #d9d0c2;
    }
    .bar button { flex: 1; }
    .bar .back { background: #fff; color: var(--green); border: 2px solid var(--green); }
    button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" tabindex="-1">
    <h1 id="title" tabindex="-1">Scripts</h1>
    <p id="where" class="where hidden"></p>
    <form id="find" role="search">
      <label for="q">Search</label>
      <input id="q" type="search" autocomplete="off" />
    </form>
    <div id="list" class="list" aria-live="polite"></div>
  </main>
  <div id="bar" class="bar hidden">
    <button type="button" class="back" id="back">Back</button>
    <button type="button" id="next">Next</button>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
